name: Build Desktop Installers
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNING_ENABLED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Import Windows code-signing certificate
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certificatePath = Join-Path $env:RUNNER_TEMP 'idk-nova-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5
          Set-Content -Path src-tauri/tauri.signing.conf.json -Value $config
      - name: Build signed Windows installers
        if: env.SIGNING_ENABLED == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: IDK Nova ${{ github.ref_name }}
          releaseBody: Download the signed Setup.exe for the guided installer, or the MSI for managed deployment.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.signing.conf.json
      - name: Build unsigned community installers
        if: env.SIGNING_ENABLED != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: IDK Nova ${{ github.ref_name }}
          releaseBody: Community build. Download Setup.exe for the guided installer, or MSI for managed deployment. This release is not code-signed yet and Windows SmartScreen may show a warning.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Keep technical signatures out of public downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name' |
            Where-Object { $_ -like '*.sig' } |
            ForEach-Object { gh release delete-asset $env:GITHUB_REF_NAME $_ --repo $env:GITHUB_REPOSITORY --yes }
  macos:
    name: macOS universal DMG
    needs: windows
    runs-on: macos-latest
    env:
      APPLE_SIGNING_IDENTITY: '-'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - name: Build universal macOS app and DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: IDK Nova ${{ github.ref_name }}
          releaseBody: Download Setup.exe for Windows or the universal DMG for Apple Silicon and Intel Macs. Community builds are not platform code-signed yet, so the operating system may ask you to approve the first launch.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target universal-apple-darwin --bundles app,dmg
      - name: Keep detached updater signatures out of public downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | \
            while read -r asset; do
              if [[ "$asset" == *.sig ]]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done
