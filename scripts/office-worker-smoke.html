<!doctype html><meta charset="utf-8"><title>Nova Office worker verification</title>
<style>body{font:16px system-ui;background:#171a18;color:#e8eee9;max-width:760px;margin:60px auto;padding:24px}button{font:inherit;padding:12px 20px;border:0;border-radius:10px}pre{white-space:pre-wrap;line-height:1.7}small{color:#a5b1a7}</style>
<h1>Office worker verification</h1><p>Synthetic data only. No provider, credentials or user files are accessed.</p><button id="run">Run Excel worker test</button><pre id="result">Not started</pre><small id="heartbeat"></small>
<script type="module">
import { runOfficeJob } from '/src/lib/office-job.ts';
let ticks = 0; setInterval(() => { document.querySelector('#heartbeat').textContent = `UI heartbeat: ${++ticks}`; }, 30);
document.querySelector('#run').onclick = async () => {
  const out = document.querySelector('#result'); out.textContent = 'Creating an XLSX in the worker…';
  try {
    const before = ticks;
    const result = await runOfficeJob('create_excel_workbook', { filename: 'worker-test', sheets: [{ name: 'Sales', rows: [['Name', 'Value'], ...Array.from({ length: 500 }, (_, i) => [`Row ${i}`, i + 1])] }] }, []);
    const inspected = await runOfficeJob('inspect_office_file', { source: 'worker-test.xlsx' }, [result.__novaAttachment]);
    if (inspected.sheets[0].numericColumns.B.sum !== 125250 || inspected.entries.length > 80 || ticks <= before) throw Error('Workbook content, paging or UI heartbeat failed');
    const controller = new AbortController();
    const cancelled = runOfficeJob('create_excel_workbook', { filename: 'cancelled', sheets: [{ name: 'Test', rows: [['X']] }] }, [], controller.signal);
    controller.abort(); let stopped = false;
    try { await cancelled; } catch (error) { stopped = error.name === 'AbortError'; }
    if (!stopped) throw Error('Cancellation failed');
    out.textContent = `PASS\nActual XLSX created and re-read in separate workers\n500 rows; numeric total: 125250\nPage entries: ${inspected.entries.length}; next offset: ${inspected.nextOffset}\nUI remained responsive\nCancellation terminated the worker`;
  } catch (error) { out.textContent = 'FAIL: ' + error.message; }
};
</script>
