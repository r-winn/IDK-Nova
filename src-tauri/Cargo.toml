[package]
name = "idk-nova"
version = "0.4.0"
description = "A private, local-first AI chat application"
authors = ["IDK contributors"]
edition = "2021"
[lib]
name = "nova_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
